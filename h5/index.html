<!DOCTYPE html>
<html lang="zh-Hans" data-theme="math-lab">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>数感训练场</title>
  <meta name="theme-color" content="#F7F3E8">
  <link rel="icon" type="image/svg+xml" href="./themes/math-lab/icon.svg">
  <!-- Nunito (SIL OFL) for Latin and digits; Chinese uses the system stack.
       Loaded without blocking first paint, so a slow or unreachable font host
       only means the system font is used. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/node_modules/@phosphor-icons/web/src/regular/style.css">
  <!-- Theme layer: math-lab is the default and only runtime theme. -->
  <link rel="stylesheet" href="./themes/math-lab/theme.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="stage" id="app">
    <!-- screens rendered by app.js -->
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
