<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>15² 反馈 · 记忆分镜</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Sora:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <button class="quiet">先停一下</button>
    <p class="demoted">15² = ?</p>
    <p class="hook">静态分镜。还没有真正播放。</p>
    <div class="frames">
      <div class="frame"><span class="n">1</span><div><b>1 × 2</b><span>先看 5 前面的 1</span></div></div>
      <div class="frame"><span class="n">2</span><div><b>2</b><span>1 × 2 得到前面这一截</span></div></div>
      <div class="frame"><span class="n">3</span><div><b>2 | 25</b><span>后面接上 25</span></div></div>
      <div class="frame"><span class="n">4</span><div><b>225</b><span>15² = 225</span></div></div>
    </div>
    <button class="cta">下一题</button>
  </main>
</body>
</html>
