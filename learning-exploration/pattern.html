<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>15² 反馈 · 规律与这一家</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Sora:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <button class="quiet">先停一下</button>
    <p class="demoted">15² = ?</p>
    <div class="panel">
      <p class="eq">15² = 225</p>
      <p class="hook">末位是 5：前面的 1 × 2 = 2，再接 25。</p>
      <p class="check">末位是 5 的整数平方，一定以 25 结尾。225 在 100 和 400 之间。</p>
      <p class="family"><b>25² = 625</b><br><b>35² = 1225</b></p>
      <p class="see">○ 看这里</p>
    </div>
    <button class="cta">下一题</button>
  </main>
</body>
</html>
