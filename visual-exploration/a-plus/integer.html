<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>澄蓝数学实验室 · 整数题</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Sora:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <div class="top">
      <button class="quiet">先停一下</button>
      <span class="pill">平方</span>
    </div>
    <h1 class="question">15² = ?</h1>
    <div class="answer" aria-label="答案"></div>
    <div class="keys">
      <button class="key">1</button><button class="key">2</button><button class="key">3</button>
      <button class="key">4</button><button class="key">5</button><button class="key">6</button>
      <button class="key">7</button><button class="key">8</button><button class="key">9</button>
      <span class="key ghost" aria-hidden="true"></span>
      <button class="key">0</button>
      <button class="key" style="font-size:15px">删除</button>
      <button class="key go">提交</button>
    </div>
  </main>
</body>
</html>
