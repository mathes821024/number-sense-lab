<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>澄蓝数学实验室 · 首页</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Sora:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <p class="kicker">Number Sense Lab</p>
    <h1>数感训练场</h1>
    <p class="lede">把常会用到的数字关系，<br>练到能直接想起来。</p>
    <div class="hero">
      <svg viewBox="0 0 360 188" aria-hidden="true">
        <g stroke="rgba(255,255,255,0.16)" stroke-width="0.7">
          <path d="M0 40 H360 M0 80 H360 M0 120 H360 M0 160 H360"/>
          <path d="M40 0 V188 M100 0 V188 M160 0 V188 M220 0 V188 M280 0 V188 M340 0 V188"/>
        </g>
        <g class="cube" fill="none" stroke="white" stroke-width="1.4">
          <polygon points="78,78 132,52 186,78 132,104" fill="rgba(255,255,255,0.22)"/>
          <polygon points="78,78 132,104 132,158 78,132" fill="rgba(255,255,255,0.1)"/>
          <polygon points="186,78 132,104 132,158 186,132" fill="rgba(8,70,90,0.28)"/>
          <polygon points="108,62 150,42 192,62 150,82" stroke="rgba(243,193,91,0.95)"/>
        </g>
        <circle cx="214" cy="96" r="3" fill="#F3C15B"/>
        <path d="M196 128 H248" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"/>
      </svg>
      <div class="hero-copy">
        <strong>今日实验</strong>
        <span>看清一个关系，就能停。</span>
      </div>
      <p class="relation"><b>15²</b><i>→ 225</i></p>
    </div>
    <button class="cta">开始今天的练习<small>大约 5～10 分钟</small></button>
    <div class="domains">
      <button class="domain">
        <svg class="mark" viewBox="0 0 42 42" aria-hidden="true">
          <rect x="6" y="6" width="13" height="13" rx="2" fill="#F3C15B"/>
          <rect x="23" y="6" width="13" height="13" rx="2" fill="#F3C15B" opacity="0.55"/>
          <rect x="6" y="23" width="13" height="13" rx="2" fill="#F3C15B" opacity="0.55"/>
          <rect x="23" y="23" width="13" height="13" rx="2" fill="#F3C15B" opacity="0.3"/>
        </svg>
        <b>平方<span>一个数乘自己</span></b>
      </button>
      <button class="domain">
        <svg class="mark" viewBox="0 0 42 42" aria-hidden="true">
          <g fill="#0C7C86">
            <circle cx="12" cy="12" r="3"/><circle cx="21" cy="12" r="3"/><circle cx="30" cy="12" r="3"/>
            <circle cx="12" cy="24" r="3"/><circle cx="21" cy="24" r="3"/><circle cx="30" cy="24" r="3"/>
          </g>
        </svg>
        <b>常用乘积<span>常会用到的一对</span></b>
      </button>
      <button class="domain">
        <svg class="mark" viewBox="0 0 42 42" aria-hidden="true">
          <rect x="6" y="16" width="30" height="10" rx="2" fill="#E4ECFB"/>
          <rect x="6" y="16" width="22" height="10" rx="2" fill="#2456C9"/>
        </svg>
        <b>分数到小数<span>把一份看清楚</span></b>
      </button>
    </div>
    <div class="links">
      <button>最近练得怎么样</button>
      <button>印到纸上</button>
    </div>
    <p class="fine">练习记录只保存在当前设备，不会自动同步到其他设备。</p>
  </main>
</body>
</html>
