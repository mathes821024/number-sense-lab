<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>暖数方块 · 首页</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone">
    <p class="eyebrow">今天可以练一小段</p>
    <h1>数感训练场</h1>
    <p class="lede">把常会用到的数字关系，练到能直接想起来。</p>
    <button class="cta">开始今天的练习<small>大约 5～10 分钟</small></button>
    <div class="stack">
      <button class="block"><span class="glyph g1">x²</span><span><b>平方</b><span>一个数乘自己</span></span></button>
      <button class="block"><span class="glyph g2">×</span><span><b>常用乘积</b><span>常会用到的一对</span></span></button>
      <button class="block"><span class="glyph g3">¾</span><span><b>分数到小数</b><span>把一份看清楚</span></span></button>
    </div>
    <div class="links" style="margin-top:16px">
      <button>最近练得怎么样</button>
      <button>印到纸上</button>
    </div>
    <p class="fine">练习记录只保存在当前设备，不会自动同步到其他设备。</p>
  </main>
</body>
</html>
