<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>澄蓝实验室 · 首页</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Sora:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone">
    <p class="kicker">Number Sense Lab</p>
    <h1>数感训练场</h1>
    <p class="lede">把常会用到的数字关系，练到能直接想起来。</p>
    <div class="hero">
      <div class="hero-core">
        <svg class="lattice" viewBox="0 0 320 170" aria-hidden="true">
          <g fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.4">
            <path d="M188 118 L236 90 L284 118 L236 146 Z"/>
            <path d="M236 90 L236 52 L284 80 L284 118"/>
            <path d="M236 52 L188 80 L188 118 L236 90"/>
          </g>
        </svg>
        <div class="hero-copy">
          <strong>今天的实验</strong>
          <span>一小段，就能停。</span>
        </div>
        <p class="hero-mark"><strong>15²</strong><span>225</span></p>
      </div>
    </div>
    <button class="cta">开始今天的练习<small>大约 5～10 分钟</small></button>
    <div class="domains">
      <button class="domain"><i></i>平方</button>
      <button class="domain"><i></i>常用乘积</button>
      <button class="domain"><i></i>分数到小数</button>
    </div>
    <div class="links">
      <button>最近练得怎么样</button>
      <button>印到纸上</button>
    </div>
    <p class="fine">练习记录只保存在当前设备，不会自动同步到其他设备。</p>
  </main>
</body>
</html>
