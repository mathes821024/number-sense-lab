<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数感工作室 · 首页</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Sora:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone">
    <div class="rule"></div>
    <p class="en">Number Sense Lab</p>
    <h1>数感<br>训练场</h1>
    <p class="lede">把常会用到的数字关系，练到能直接想起来。</p>
    <button class="cta">开始今天的练习<small>大约 5～10 分钟</small></button>
    <div class="rows">
      <button><span>平方</span><em>x²</em></button>
      <button><span>常用乘积</span><em>×</em></button>
      <button><span>分数到小数</span><em>¾</em></button>
    </div>
    <div class="links" style="margin-top:18px">
      <button>最近练得怎么样</button>
      <button>印到纸上</button>
    </div>
    <p class="fine">练习记录只保存在当前设备，不会自动同步到其他设备。</p>
  </main>
</body>
</html>
