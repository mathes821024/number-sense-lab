<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数感工作室 · 答错</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Sora:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone">
    <button class="quiet">先停一下</button>
    <p class="demoted">15² = ?</p>
    <div class="wrong">
      <p class="relation">15 × 15 = 225</p>
      <p class="hint">平方就是这个数乘自己。</p>
      <p class="mark">看这里</p>
    </div>
    <button class="cta">下一题</button>
  </main>
</body>
</html>
